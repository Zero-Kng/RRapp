openapi: 3.0.3
info:
  title: rrapp API
  version: 1.0.0
  description: 'API do rrapp: rede social de reviews de restaurantes.'
paths:
  /api/v1/auth/cadastro:
    post:
      operationId: auth_cadastro_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CadastroRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CadastroRequest'
        required: true
      security:
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sessao'
          description: ''
        default:
          description: Erro
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
  /api/v1/auth/eu:
    get:
      operationId: auth_eu_retrieve
      tags:
      - auth
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Eu'
          description: ''
        default:
          description: Erro
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
  /api/v1/auth/login:
    post:
      operationId: auth_login_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sessao'
          description: ''
        default:
          description: Erro
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
  /api/v1/auth/logout:
    post:
      operationId: auth_logout_create
      description: 'Sem CSRF de propósito: o pior que um site malicioso consegue é
        deslogar alguém.'
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RenovacaoRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RenovacaoRequest'
      security:
      - {}
      responses:
        '204':
          description: No response body
        default:
          description: Erro
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
  /api/v1/auth/senha/esqueci:
    post:
      operationId: auth_senha_esqueci_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EsqueciSenhaRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/EsqueciSenhaRequest'
        required: true
      security:
      - {}
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Mensagem'
          description: ''
        default:
          description: Erro
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
  /api/v1/auth/senha/redefinir:
    post:
      operationId: auth_senha_redefinir_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RedefinirSenhaRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RedefinirSenhaRequest'
        required: true
      security:
      - {}
      responses:
        '204':
          description: No response body
        default:
          description: Erro
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
  /api/v1/auth/token/renovar:
    post:
      operationId: auth_token_renovar_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RenovacaoRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RenovacaoRequest'
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Acesso'
          description: ''
        default:
          description: Erro
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
  /api/v1/bairros:
    get:
      operationId: bairros_list
      parameters:
      - in: query
        name: cidade
        schema:
          type: string
        required: true
      tags:
      - bairros
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
          description: ''
        default:
          description: Erro
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
  /api/v1/categorias:
    get:
      operationId: categorias_list
      tags:
      - categorias
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Categoria'
          description: ''
        default:
          description: Erro
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
  /api/v1/cidades:
    get:
      operationId: cidades_list
      tags:
      - cidades
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Cidade'
          description: ''
        default:
          description: Erro
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
  /api/v1/eu/desejos/{slug}:
    put:
      operationId: eu_desejos_update
      description: Guarda ou tira um restaurante dos desejos; repetir a mesma ação
        não dá erro.
      parameters:
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - eu
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
        default:
          description: Erro
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
    delete:
      operationId: eu_desejos_destroy
      description: Guarda ou tira um restaurante dos desejos; repetir a mesma ação
        não dá erro.
      parameters:
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - eu
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
        default:
          description: Erro
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
  /api/v1/eu/excluir:
    post:
      operationId: eu_excluir_create
      description: POST (e não DELETE) para que o corpo com a senha apareça no OpenAPI.
      tags:
      - eu
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmarSenhaRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ConfirmarSenhaRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
        default:
          description: Erro
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
  /api/v1/eu/perfil:
    patch:
      operationId: eu_perfil_partial_update
      tags:
      - eu
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedAtualizarPerfilRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedAtualizarPerfilRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Eu'
          description: ''
        default:
          description: Erro
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
  /api/v1/eu/senha:
    post:
      operationId: eu_senha_create
      tags:
      - eu
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TrocarSenhaRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TrocarSenhaRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Acesso'
          description: ''
        default:
          description: Erro
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
  /api/v1/registros:
    post:
      operationId: registros_create
      tags:
      - registros
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistroRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RegistroRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Registro'
          description: ''
        default:
          description: Erro
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
  /api/v1/registros/{id}:
    get:
      operationId: registros_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - registros
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Registro'
          description: ''
        default:
          description: Erro
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
    patch:
      operationId: registros_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - registros
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedRegistroRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedRegistroRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Registro'
          description: ''
        default:
          description: Erro
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
    delete:
      operationId: registros_destroy
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - registros
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
        default:
          description: Erro
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
  /api/v1/registros/{id}/fotos:
    post:
      operationId: registros_fotos_create
      description: Envia uma foto para uma visita (até 4). Cada envio é uma foto.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - registros
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/EnvioFotoRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Foto'
          description: ''
        default:
          description: Erro
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
  /api/v1/registros/{id}/fotos/{foto_id}:
    delete:
      operationId: registros_fotos_destroy
      parameters:
      - in: path
        name: foto_id
        schema:
          type: integer
        required: true
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - registros
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
        default:
          description: Erro
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
  /api/v1/restaurantes:
    get:
      operationId: restaurantes_list
      parameters:
      - in: query
        name: bairro
        schema:
          type: string
          minLength: 1
          maxLength: 100
      - in: query
        name: categoria
        schema:
          type: string
          minLength: 1
          pattern: ^[-a-zA-Z0-9_]+$
      - in: query
        name: cidade
        schema:
          type: string
          minLength: 1
          pattern: ^[-a-zA-Z0-9_]+$
      - in: query
        name: nota_min
        schema:
          type: string
          format: decimal
          pattern: ^-?\d{0,1}(?:\.\d{0,1})?$
      - in: query
        name: ordem
        schema:
          enum:
          - relevancia
          - nome
          - nota
          - populares
          - recentes
          type: string
          minLength: 1
        description: |-
          * `relevancia` - relevancia
          * `nome` - nome
          * `nota` - nota
          * `populares` - populares
          * `recentes` - recentes
      - name: page
        required: false
        in: query
        description: Um número de página dentro do conjunto de resultados paginado.
        schema:
          type: integer
      - in: query
        name: preco
        schema:
          type: integer
          maximum: 4
          minimum: 1
      - in: query
        name: q
        schema:
          type: string
          maxLength: 100
      tags:
      - restaurantes
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedRestauranteResumoList'
          description: ''
        default:
          description: Erro
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
  /api/v1/restaurantes/{slug}:
    get:
      operationId: restaurantes_retrieve
      parameters:
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - restaurantes
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestauranteDetalhe'
          description: ''
        default:
          description: Erro
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
  /api/v1/restaurantes/{slug}/registros:
    get:
      operationId: restaurantes_registros_list
      parameters:
      - name: page
        required: false
        in: query
        description: Um número de página dentro do conjunto de resultados paginado.
        schema:
          type: integer
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - restaurantes
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedRegistroList'
          description: ''
        default:
          description: Erro
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
  /api/v1/usuarios/{username}:
    get:
      operationId: usuarios_retrieve
      parameters:
      - in: path
        name: username
        schema:
          type: string
        required: true
      tags:
      - usuarios
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PerfilPublico'
          description: ''
        default:
          description: Erro
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
  /api/v1/usuarios/{username}/criticas:
    get:
      operationId: usuarios_criticas_list
      parameters:
      - name: page
        required: false
        in: query
        description: Um número de página dentro do conjunto de resultados paginado.
        schema:
          type: integer
      - in: path
        name: username
        schema:
          type: string
        required: true
      tags:
      - usuarios
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedRegistroList'
          description: ''
        default:
          description: Erro
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
  /api/v1/usuarios/{username}/desejos:
    get:
      operationId: usuarios_desejos_list
      parameters:
      - in: query
        name: ordem
        schema:
          enum:
          - recentes
          - bairro
          type: string
          default: recentes
          minLength: 1
        description: |-
          * `recentes` - recentes
          * `bairro` - bairro
      - name: page
        required: false
        in: query
        description: Um número de página dentro do conjunto de resultados paginado.
        schema:
          type: integer
      - in: path
        name: username
        schema:
          type: string
        required: true
      tags:
      - usuarios
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedDesejoList'
          description: ''
        default:
          description: Erro
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
  /api/v1/usuarios/{username}/diario:
    get:
      operationId: usuarios_diario_list
      parameters:
      - in: query
        name: ano
        schema:
          type: integer
          maximum: 2100
          minimum: 1900
      - in: query
        name: mes
        schema:
          type: integer
          maximum: 12
          minimum: 1
      - name: page
        required: false
        in: query
        description: Um número de página dentro do conjunto de resultados paginado.
        schema:
          type: integer
      - in: path
        name: username
        schema:
          type: string
        required: true
      tags:
      - usuarios
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedRegistroList'
          description: ''
        default:
          description: Erro
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
components:
  schemas:
    Acesso:
      type: object
      properties:
        acesso:
          type: string
        renovacao:
          type: string
      required:
      - acesso
    BarraHistograma:
      type: object
      properties:
        nota:
          type: number
          format: double
        quantidade:
          type: integer
      required:
      - nota
      - quantidade
    CadastroRequest:
      type: object
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 30
        email:
          type: string
          format: email
          minLength: 1
          maxLength: 254
        senha:
          type: string
          writeOnly: true
          minLength: 1
          maxLength: 128
        aceite_termos:
          type: boolean
      required:
      - aceite_termos
      - email
      - senha
      - username
    Categoria:
      type: object
      properties:
        slug:
          type: string
          maxLength: 140
          pattern: ^[-a-zA-Z0-9_]+$
        nome:
          type: string
          maxLength: 120
      required:
      - nome
      - slug
    CategoriaRequest:
      type: object
      properties:
        slug:
          type: string
          minLength: 1
          maxLength: 140
          pattern: ^[-a-zA-Z0-9_]+$
        nome:
          type: string
          minLength: 1
          maxLength: 120
      required:
      - nome
      - slug
    Cidade:
      type: object
      properties:
        slug:
          type: string
          maxLength: 120
          pattern: ^[-a-zA-Z0-9_]+$
        nome:
          type: string
          maxLength: 100
        estado:
          type: string
          title: Estado (UF)
          maxLength: 2
      required:
      - estado
      - nome
      - slug
    CidadeRequest:
      type: object
      properties:
        slug:
          type: string
          minLength: 1
          maxLength: 120
          pattern: ^[-a-zA-Z0-9_]+$
        nome:
          type: string
          minLength: 1
          maxLength: 100
        estado:
          type: string
          minLength: 1
          title: Estado (UF)
          maxLength: 2
      required:
      - estado
      - nome
      - slug
    ConfirmarSenhaRequest:
      type: object
      properties:
        senha:
          type: string
          minLength: 1
          maxLength: 128
      required:
      - senha
    Desejo:
      type: object
      properties:
        restaurante:
          allOf:
          - $ref: '#/components/schemas/RestauranteResumo'
          readOnly: true
        adicionado_em:
          type: string
          format: date-time
          readOnly: true
      required:
      - adicionado_em
      - restaurante
    EnvioFotoRequest:
      type: object
      properties:
        imagem:
          type: string
          format: binary
      required:
      - imagem
    EsqueciSenhaRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          minLength: 1
          maxLength: 254
      required:
      - email
    Eu:
      type: object
      properties:
        username:
          type: string
          readOnly: true
          title: Usuário
          description: Obrigatório. 150 caracteres ou menos. Letras, números e @/./+/-/_
            apenas.
        email:
          type: string
          format: email
          readOnly: true
          title: E-mail
        nome_exibicao:
          type: string
          readOnly: true
          title: Nome de exibição
        bio:
          type: string
          readOnly: true
        avatar:
          type: string
          format: uri
          nullable: true
          readOnly: true
        cidade:
          allOf:
          - $ref: '#/components/schemas/Cidade'
          readOnly: true
          nullable: true
        membro_desde:
          type: string
          format: date-time
          readOnly: true
      required:
      - avatar
      - bio
      - cidade
      - email
      - membro_desde
      - nome_exibicao
      - username
    Foto:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        imagem:
          type: string
          readOnly: true
        miniatura:
          type: string
          readOnly: true
        largura:
          type: integer
          readOnly: true
        altura:
          type: integer
          readOnly: true
      required:
      - altura
      - id
      - imagem
      - largura
      - miniatura
    LoginRequest:
      type: object
      properties:
        login:
          type: string
          minLength: 1
          maxLength: 254
        senha:
          type: string
          minLength: 1
          maxLength: 128
      required:
      - login
      - senha
    Mensagem:
      type: object
      properties:

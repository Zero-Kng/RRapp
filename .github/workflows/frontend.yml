name: frontend

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run tipos:verificar
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high
      # O teste de ponta a ponta (npm run test:e2e) não roda aqui: depende da base de restaurantes importada
